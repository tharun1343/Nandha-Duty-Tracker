name: Build app

# Update pipeline. Every push runs the tests, then builds a signed Android APK.
#  - Default branch (or main): GitHub Release "vX.Y.N", the web version on GitHub Pages
#    (with version.json), and the public Supabase "releases" bucket when SUPABASE_SECRET_KEY is set.
#    Installed apps read version.json and update in place (Android: in-app download + installer;
#    web: the service worker swaps to the new version and reloads).
#  - Any other branch: the "preview" pre-release is replaced with the new APK.
#
# Settings (GitHub → Settings → Secrets and variables → Actions):
#  Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#             SUPABASE_SECRET_KEY  (Supabase → Project Settings → API Keys → secret key; upload only)
#  Variables (optional overrides of .env.production): SUPABASE_URL, SUPABASE_ANON_KEY, UPDATE_URL
on:
  push:
    branches: ['**']
    paths-ignore: ['prototype/**', 'docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests (sync engine)
        run: npm test
      - name: Install Chromium for the end-to-end test
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (built app against a fake Supabase)
        run: |
          npm run e2e | tee e2e.txt
          grep -q "FAILS: 0  CONSOLE ERRORS: 0" e2e.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshots, path: tests/e2e/shots, retention-days: 7 }

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      STABLE: ${{ github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Version (major.minor from package.json + run number)
        id: v
        run: |
          MM=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "name=$MM.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: App settings
        env:
          V_URL: ${{ vars.SUPABASE_URL }}
          V_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          V_UPD: ${{ vars.UPDATE_URL }}
        run: |
          # Repository variables override .env.production only when they are set.
          [ -n "$V_URL" ] && echo "VITE_SUPABASE_URL=${V_URL%/rest/v1*}" >> "$GITHUB_ENV"
          [ -n "$V_KEY" ] && echo "VITE_SUPABASE_ANON_KEY=$V_KEY" >> "$GITHUB_ENV"
          [ -n "$V_UPD" ] && echo "VITE_UPDATE_URL=$V_UPD" >> "$GITHUB_ENV"
          SB_URL="${V_URL:-$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)}"
          SB_KEY="${V_KEY:-$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)}"
          echo "SB_URL=${SB_URL%/rest/v1*}" >> "$GITHUB_ENV"
          echo "SB_KEY=$SB_KEY" >> "$GITHUB_ENV"
          true

      - name: Check Supabase setup (warns, never fails the build)
        run: |
          code=$(curl -s -o body.txt -w "%{http_code}" "$SB_URL/rest/v1/records?select=id&limit=1" -H "apikey: $SB_KEY" || echo 000)
          echo "records table → HTTP $code: $(head -c 200 body.txt)"
          if grep -q "PGRST205\|does not exist\|Could not find the table" body.txt; then
            echo "::warning::Supabase table 'records' not found. Run supabase/schema.sql in Supabase → SQL Editor (see docs/SETUP.md)."
          elif [ "$code" = "401" ] || [ "$code" = "403" ] || grep -q "permission denied" body.txt; then
            echo "Supabase table exists and is locked to signed-in users (expected)."
          elif [ "$code" = "200" ]; then
            echo "Supabase reachable."
          else
            echo "::warning::Could not check Supabase (HTTP $code)."
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SB_URL/storage/v1/bucket/releases" -H "apikey: $SB_KEY" || echo 000)
          echo "releases bucket → HTTP $code"

      - name: Build web app
        run: npx vite build
        env:
          VITE_APP_VERSION: ${{ steps.v.outputs.name }}
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this APK is debug-signed and won't install over other builds. Add the 4 signing secrets (docs/SETUP.md)."
          fi
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.v.outputs.code }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../duty-tracker.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../duty-tracker.apk
          fi
          rm -f app/release.jks

      - name: Publish to the Supabase update channel (default branch)
        id: sb
        if: env.STABLE == 'true'
        env:
          SB_SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
          VER: ${{ steps.v.outputs.name }}
        run: |
          if [ -z "$SB_SECRET" ]; then
            echo "::warning::No SUPABASE_SECRET_KEY secret — skipped the in-app update channel. The APK is still on GitHub Releases."
            exit 0
          fi
          if [ "$SIGNED" != "1" ]; then
            echo "::warning::Not publishing a debug-signed APK to phones. Add the signing secrets first."
            exit 0
          fi
          up() { # file, object name, content type
            for auth in no yes; do
              extra=(); [ "$auth" = yes ] && extra=(-H "Authorization: Bearer $SB_SECRET")
              code=$(curl -s -o resp.txt -w "%{http_code}" -X POST "$SB_URL/storage/v1/object/releases/$2" \
                -H "apikey: $SB_SECRET" "${extra[@]}" -H "x-upsert: true" -H "cache-control: max-age=60" \
                -H "Content-Type: $3" --data-binary "@$1")
              if [ "$code" = "200" ]; then echo "uploaded $2"; return 0; fi
            done
            echo "::error::Upload of $2 failed (HTTP $code): $(head -c 300 resp.txt)"; return 1
          }
          # Create the public "releases" bucket on first use (no SQL step needed).
          for auth in no yes; do
            extra=(); [ "$auth" = yes ] && extra=(-H "Authorization: Bearer $SB_SECRET")
            code=$(curl -s -o resp.txt -w "%{http_code}" -X POST "$SB_URL/storage/v1/bucket" -H "apikey: $SB_SECRET" "${extra[@]}" \
              -H "Content-Type: application/json" -d '{"id":"releases","name":"releases","public":true,"file_size_limit":52428800}')
            if [ "$code" = "200" ] || grep -qi "already exists\|Duplicate" resp.txt; then echo "releases bucket ready"; break; fi
          done
          export BASE="$SB_URL/storage/v1/object/public/releases"
          up duty-tracker.apk "duty-tracker-$VER.apk" application/vnd.android.package-archive
          up duty-tracker.apk "duty-tracker-latest.apk" application/vnd.android.package-archive
          node -e "console.log(JSON.stringify({ version: process.env.VER, apk: process.env.BASE + '/duty-tracker-' + process.env.VER + '.apk', signed: true, notes: 'New version of Daily Duty Tracker', built: new Date().toISOString() }, null, 2))" > version.json
          up version.json version.json application/json
          echo "published=1" >> "$GITHUB_OUTPUT"
          echo "latest=$BASE/duty-tracker-latest.apk" >> "$GITHUB_OUTPUT"
      - name: version.json (GitHub Pages / release page)
        if: steps.sb.outputs.published != '1'
        env:
          VER: ${{ steps.v.outputs.name }}
          TAG: ${{ env.STABLE == 'true' && format('v{0}', steps.v.outputs.name) || 'preview' }}
        run: |
          # apk = the release asset (downloadable without login once the repository is public)
          node -e "console.log(JSON.stringify({ version: process.env.VER, apk: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/download/' + process.env.TAG + '/duty-tracker.apk', signed: process.env.SIGNED === '1', notes: 'New version of Daily Duty Tracker', built: new Date().toISOString() }, null, 2))" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: duty-tracker-${{ steps.v.outputs.name }}
          path: |
            duty-tracker.apk
            version.json

      - name: GitHub Release (default branch)
        if: env.STABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.name }}" duty-tracker.apk version.json \
            --target "${{ github.sha }}" --latest \
            --title "Duty Tracker ${{ steps.v.outputs.name }}" \
            --notes "Install: download duty-tracker.apk on your Android phone and open it. Signed: $SIGNED."
      - name: Latest APK branch (default branch)
        if: env.STABLE == 'true'
        # Keeps the newest APK on a one-commit branch "apk-latest" (old copies are replaced),
        # so it can be fetched with git even while the repository is private.
        run: |
          mkdir apkbr && cp duty-tracker.apk version.json apkbr/
          cd apkbr
          printf '# Latest Duty Tracker APK\n\nVersion ${{ steps.v.outputs.name }} (signed: %s). Built from ${{ github.sha }}.\n' "$SIGNED" > README.md
          git init -q -b apk-latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Duty Tracker ${{ steps.v.outputs.name }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-latest
      - name: Preview release (other branches)
        if: env.STABLE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview duty-tracker.apk version.json \
            --target "${{ github.sha }}" --prerelease \
            --title "Preview ${{ steps.v.outputs.name }} (${{ github.ref_name }})" \
            --notes "Test build from branch ${{ github.ref_name }}. Signed: $SIGNED."

      - name: Web version for GitHub Pages (default branch)
        if: env.STABLE == 'true'
        run: cp version.json dist/version.json
      - if: env.STABLE == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }

      - name: Summary
        run: |
          {
            echo "### Duty Tracker ${{ steps.v.outputs.name }}"
            echo "- Signed: $SIGNED"
            [ "$STABLE" = "true" ] && echo "- GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.v.outputs.name }}" || echo "- Preview: https://github.com/${{ github.repository }}/releases/tag/preview"
            [ -n "${{ steps.sb.outputs.latest }}" ] && echo "- Direct download (no login): ${{ steps.sb.outputs.latest }}"
            [ "$STABLE" = "true" ] && echo "- Web version: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (needs GitHub Pages switched on)"
            true
          } >> "$GITHUB_STEP_SUMMARY"

  # Web version (Windows / any browser). Needs Settings → Pages → Source: GitHub Actions,
  # which GitHub only offers for public repositories on the free plan. Until then this job
  # fails quietly without blocking the APK.
  pages:
    needs: android
    if: github.ref_name == github.event.repository.default_branch || github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
