name: Build app

# Every push: tests, then a signed Android APK.
#  - main          → GitHub Release "vX.Y.N" (latest) + version.json for the in-app update banner
#  - other branches → the "preview" pre-release is replaced with the new APK
# Repository settings used (Settings → Secrets and variables → Actions):
#  Variables: SUPABASE_URL, SUPABASE_ANON_KEY (public anon key), PAGES_ENABLED=true (optional, public repos)
#  Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    branches: ['**']
    paths-ignore: ['prototype/**', 'docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests (sync engine)
        run: npm test
      - name: Install Chromium for the end-to-end test
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (built app against a fake Supabase)
        run: |
          npm run e2e | tee e2e.txt
          grep -q "FAILS: 0  CONSOLE ERRORS: 0" e2e.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshots, path: tests/e2e/shots, retention-days: 7 }

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VITE_UPDATE_URL: ${{ vars.UPDATE_URL || (vars.PAGES_ENABLED == 'true' && format('https://{0}.github.io/{1}/version.json', github.repository_owner, github.event.repository.name)) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Version (major.minor from package.json + run number)
        id: v
        run: |
          MM=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "name=$MM.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Build web app
        run: npx vite build
        env:
          VITE_APP_VERSION: ${{ steps.v.outputs.name }}
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a debug-signed APK. Add the signing secrets so updates install over each other."
          fi
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.v.outputs.code }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../duty-tracker.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../duty-tracker.apk
          fi
          rm -f app/release.jks
      - name: version.json
        run: |
          node -e "
            const main = process.env.GITHUB_REF === 'refs/heads/main';
            const base = 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/' + (main ? 'latest/download' : 'download/preview');
            console.log(JSON.stringify({ version: '${{ steps.v.outputs.name }}', apk: base + '/duty-tracker.apk', notes: 'New version of Daily Duty Tracker', built: new Date().toISOString() }, null, 2));
          " > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: duty-tracker-${{ steps.v.outputs.name }}
          path: |
            duty-tracker.apk
            version.json
      - name: Publish release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.name }}" duty-tracker.apk version.json \
            --target "${{ github.sha }}" --latest \
            --title "Duty Tracker ${{ steps.v.outputs.name }}" \
            --notes "Install: download duty-tracker.apk on your Android phone and open it. Signed: ${SIGNED:-0}."
      - name: Publish preview (other branches)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview duty-tracker.apk version.json \
            --target "${{ github.sha }}" --prerelease \
            --title "Preview ${{ steps.v.outputs.name }} (${{ github.ref_name }})" \
            --notes "Test build from branch ${{ github.ref_name }}. Signed: ${SIGNED:-0}."
      - name: Prepare web version for GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        run: cp version.json dist/version.json
      - if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
